# Máy chủ đám mây "Tín hiệu": gửi Telegram cả khi không mở web.
# Cứ 10 phút GitHub bật máy chủ một lần, mỗi lần chạy liên tục ~9,5 phút và làm mới tín hiệu mỗi 60 giây
# → gần như theo dõi liên tục. Hướng dẫn cài đặt: bot/HUONG-DAN.md
name: Tín hiệu – máy chủ Telegram
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: tin-hieu-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy máy chủ
        run: node bot/bot.js
        env:
          TZ: Asia/Ho_Chi_Minh
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BOT_MINUTES: '9.5'
          BOT_EVERY: '60'
